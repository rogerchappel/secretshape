secrets:
  GITHUB_TOKEN:
    required: true
    pattern: "^ghp_[A-Za-z0-9_]+$"
    description: GitHub token used by release automation
  OPENAI_API_KEY:
    required: true
    pattern: "^sk-[A-Za-z0-9_-]+$"
    description: OpenAI API key used by local development tools
  NODE_ENV:
    required: false
    enum: [development, test, production]
    description: Runtime environment label
